# 滑动窗口短期记忆：每次喂给模型的历史消息条数上限（控制上下文长度，避免长对话 token 膨胀）
memory_window: 20

# 长期记忆开关：开启后每轮对话抽取原子事实去重入库，检索时按相似度召回注入 prompt
long_term_memory_enabled: true
# 长期记忆每次召回的条数
memory_recall_k: 3
# viking 分层记忆开关：开启走"mem0 治理 + viking 分层组织与目录递归检索"，
# 关闭回退到 mem0 扁平 top-k 版（agent/memory_store.py）
viking_enabled: true
# 目录级 L0 阈值：扫 .abstract.md 定位高分目录时，余弦相似度低于该值视为不相关
viking_dir_threshold: 0.30
# 条目级 L0 阈值：目录内扫条目摘要时，余弦相似度低于该值视为不相关
viking_entry_threshold: 0.25

# ===== 自研 Agent Loop 治理参数 =====
# 推理步数上限：超过后强制终止，防止模型在死循环里打转
loop_max_steps: 8
# 上下文压缩触发步数：达到该步数后，把早期 tool observation 摘要成一段
compress_after_steps: 6
# 上下文压缩 token 阈值：非 system 消息正文累计超过该值也触发压缩（与步数「任一命中」即压）
# 注：token 计数走 get_num_tokens 的 GPT-2 fallback，对 Qwen 非精确值，作「占用是否够长」的代理指标
compress_token_threshold: 4000
# 重复调用检测：同一工具+同一参数连续调用该次数后，注入提示让模型换思路
dedup_max_repeat: 2
# 是否启用自研 Loop（false 时回退 create_agent）
custom_loop_enabled: true
